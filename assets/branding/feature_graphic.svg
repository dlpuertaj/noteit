<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <title>noteIt feature graphic</title>

  <!-- Background -->
  <rect width="1024" height="500" fill="#FAFAFA"/>

  <!-- Icon mark — Book Antiqua N, same as icon.svg -->
  <svg x="0" y="0" width="420" height="500" viewBox="0 0 1024 1024" preserveAspectRatio="xMidYMid meet">
    <text x="512" y="757"
          font-family="'Book Antiqua', Palatino, serif"
          font-size="720"
          font-weight="400"
          fill="#111827"
          text-anchor="middle">N</text>
  </svg>

  <!-- Vertical divider -->
  <line x1="420" y1="60" x2="420" y2="440"
        stroke="#E5E7EB"
        stroke-width="1"/>

  <!-- Wordmark -->
  <text x="722" y="262"
        font-family="'Book Antiqua', Palatino, serif"
        font-size="110"
        font-weight="400"
        fill="#111827"
        text-anchor="middle">noteIt</text>

  <!-- Tagline -->
  <text x="722" y="318"
        font-family="'Book Antiqua', Palatino, serif"
        font-size="26"
        font-weight="400"
        fill="#9CA3AF"
        text-anchor="middle"
        letter-spacing="4">simple · offline · yours</text>
</svg>
